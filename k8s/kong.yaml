apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: conexao-solidaria
data:
  kong.yml: |
    _format_version: "3.0"
    consumers:
      - username: cs-client
        jwt_secrets:
          - key: CS.Identity.API
            algorithm: HS256
            secret: "CS#Solidaria@JwtKey2026!Hackaton11Nett"
    services:
      - name: identity-api
        url: http://cs-identity-api:8080
        routes:
          - name: identity-route
            paths: ["/identity"]
            strip_path: true
      - name: campaigns-api
        url: http://cs-campaigns-api:8080
        routes:
          - name: campaigns-ativas
            paths: ["/campaigns/api/campanhas/ativas"]
            strip_path: false
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /api/campanhas/ativas
          - name: campaigns-health
            paths: ["/campaigns/health"]
            strip_path: false
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /health
          - name: campaigns-route
            paths: ["/campaigns"]
            strip_path: true
            plugins:
              - name: jwt
                config:
                  key_claim_name: iss
                  claims_to_verify: ["exp"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.8
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
          ports:
            - containerPort: 8000
            - containerPort: 8001
          volumeMounts:
            - name: kong
              mountPath: /kong
      volumes:
        - name: kong
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: conexao-solidaria
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30080
    - name: admin
      port: 8001
      targetPort: 8001
      nodePort: 30081
